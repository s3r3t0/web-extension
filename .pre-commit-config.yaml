repos:
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.1
  hooks:
  - id: gitleaks
- repo: https://github.com/pre-commit/mirrors-eslint
  rev: v9.35.0
  hooks:
  - id: eslint
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-added-large-files
  - id: check-json
  - id: check-toml
  - id: check-yaml
  - id: end-of-file-fixer
  - id: fix-byte-order-marker
  - id: mixed-line-ending
  - id: trailing-whitespace
- repo: local
  hooks:
  - id: ruff-check
    name: ruff
    entry: uv run --group lint ruff check
    language: system
    types: [python]
  - id: ty-check
    name: ty
    entry: uv run --group lint --group test ty check
    language: system
    pass_filenames: false
    types: [python]
