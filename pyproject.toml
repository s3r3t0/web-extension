[project]
name = "sereto-cookie-lab"
version = "0.1.0"
description = "Standards-first cookie testing lab for SeReTo Helper extension QA"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["Flask~=3.1", "cryptography~=50.0.0"]

[dependency-groups]
dev = ["pre-commit~=4.7.0", "tox~=4.30"]
docs = ["zensical~=0.1.1", "mkdocstrings-python~=2.0"]
lint = ["ruff~=0.17.0", "ty~=0.0.84"]
test = [
    "playwright~=1.63",
    "pytest~=9.2.0",
    "pytest-cov~=7.1",
    "pytest-playwright>=0.10.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.tox]
min_version = "4.0"
env_list = ["lint", "type", "precommit", "3.12", "3.13", "3.14"]
skip_missing_interpreters = true

[tool.tox.env_run_base]
dependency_groups = ["test"]
commands = [["playwright", "install"], ["pytest"]]

[tool.tox.env.lint]
dependency_groups = ["lint"]
commands = [["ruff", "check", "cookie_lab"], ["ruff", "check", "tests"]]

[tool.tox.env.type]
dependency_groups = ["lint", "test"]
commands = [["ty", "check", "cookie_lab"], ["ty", "check", "tests"]]

[tool.tox.env.format]
dependency_groups = ["lint"]
commands = [
    [
        "ruff",
        "check",
        "--fix",
        "cookie_lab",
    ],
    [
        "ruff",
        "format",
        "cookie_lab",
    ],
    [
        "ruff",
        "check",
        "--fix",
        "tests",
    ],
    [
        "ruff",
        "format",
        "tests",
    ],
]

[tool.tox.env.precommit]
dependency_groups = ["dev", "lint", "test"]
commands = [["pre-commit", "run", "--all-files"]]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
extend-select = [
    # flake8-bugbear: higher-signal correctness and maintainability checks.
    "B",
    # pydocstyle: require docstrings for package code.
    "D",
    # isort: keep imports consistently ordered.
    "I",
    # flake8-simplify: prefer simpler equivalent control flow and expressions.
    "SIM",
    # pyupgrade: prefer modern Python syntax and APIs.
    "UP",
]
ignore = [
    # incorrect-blank-line-before-class: conflicts with the formatter-friendly class docstring convention.
    "D203",
    # multi-line-summary-second-line: conflicts with the single-line summary convention used in this repo.
    "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.setuptools.packages.find]
include = ["cookie_lab*"]

[build-system]
requires = ["setuptools~=84.0", "wheel"]
build-backend = "setuptools.build_meta"
